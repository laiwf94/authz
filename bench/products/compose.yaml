# The products of the benchmark, each at a pinned version with its
# recommended production settings (README.md says what each setting is
# for), on the same CPU and memory limits:
#
#   docker compose -f bench/products/compose.yaml --profile spicedb up -d
#
# Profiles: authz, spicedb, openfga (authorization), keycloak (Keycloak
# with oauth2-proxy in front of it, for sign-ins and forward-auth) and
# zitadel (sign-ins). Every
# image is pinned by tag and digest, and an image built here is built
# from pinned images; products_test.go fails on an image without both. Ports are bound
# to 127.0.0.1 only. The keys below are the benchmark's own, public on
# purpose like the dataset's passwords; set the variables to replace them.
# BENCH_CPUS and BENCH_MEMORY set the limits of each server and each
# database (default 2 CPUs and 4 GB); BENCH_LOOKUP_LIMIT is the most
# objects one OpenFGA ListObjects answers (default 100, authzbench's
# -lookup-limit).

name: authz-bench

x-limits: &limits
  cpus: ${BENCH_CPUS:-2}
  mem_limit: ${BENCH_MEMORY:-4g}

# Every product's database runs the same PostgreSQL with the same settings:
# shared_buffers a quarter of the memory limit, as PostgreSQL's own tuning
# guide suggests, synchronous commits kept (durable writes, as in
# production), and track_commit_timestamp, which SpiceDB's Watch API needs.
x-postgres: &postgres
  <<: *limits
  image: postgres:17.12-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
  command:
    - postgres
    - -c
    - shared_buffers=1GB
    - -c
    - effective_cache_size=3GB
    - -c
    - max_connections=200
    - -c
    - track_commit_timestamp=on
  environment:
    POSTGRES_USER: bench
    POSTGRES_PASSWORD: bench
    POSTGRES_DB: bench
  healthcheck:
    test: ["CMD", "pg_isready", "-U", "bench", "-d", "bench"]
    interval: 1s
    timeout: 3s
    retries: 60
  shm_size: 1g

services:
  # authz serve, built from this checkout's Dockerfile, writing its
  # write-ahead log to a volume: its store is inside the process, so its
  # one container holds what the others need a database for.
  authz:
    <<: *limits
    profiles: [authz]
    build:
      context: ../..
    image: authz:bench
    environment:
      GRANTD_ADDR: ":8080"
      GRANTD_DATA_DIR: /data
      GRANTD_API_KEYS: ${AUTHZ_KEY:-bench-authz-key-0123456789}
      GRANTD_TOKEN_KEY: ${AUTHZ_TOKEN_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      GRANTD_LOG_LEVEL: warn
    volumes:
      - authz-data:/data
    ports:
      - 127.0.0.1:18080:8080

  spicedb-postgres:
    <<: *postgres
    profiles: [spicedb]
    volumes:
      - spicedb-pg:/var/lib/postgresql/data

  spicedb-migrate:
    profiles: [spicedb]
    image: authzed/spicedb:v1.57.1@sha256:9ea6df2d3cca23ed63aa7205639cf6babaaf1dc9a264ffb1f50c6455658fd6ba
    command: [migrate, head, --datastore-engine, postgres,
      --datastore-conn-uri, "postgres://bench:bench@spicedb-postgres:5432/bench?sslmode=disable"]
    depends_on:
      spicedb-postgres: {condition: service_healthy}
    restart: on-failure:5

  spicedb:
    <<: *limits
    profiles: [spicedb]
    image: authzed/spicedb:v1.57.1@sha256:9ea6df2d3cca23ed63aa7205639cf6babaaf1dc9a264ffb1f50c6455658fd6ba
    command:
      - serve
      - --grpc-preshared-key=${SPICEDB_KEY:-bench-spicedb-key-0123456789}
      - --datastore-engine=postgres
      - --datastore-conn-uri=postgres://bench:bench@spicedb-postgres:5432/bench?sslmode=disable
      - --datastore-conn-pool-read-max-open=40
      - --datastore-conn-pool-write-max-open=20
      - --http-enabled
      - --http-addr=:8443
      - --telemetry-endpoint=
      - --log-format=json
      - --log-level=warn
    depends_on:
      spicedb-migrate: {condition: service_completed_successfully}
    ports:
      - 127.0.0.1:18443:8443

  openfga-postgres:
    <<: *postgres
    profiles: [openfga]
    volumes:
      - openfga-pg:/var/lib/postgresql/data

  openfga-migrate:
    profiles: [openfga]
    image: openfga/openfga:v1.23.0@sha256:2a1b4ef95f2f27e6d420f11cf14390b4f537e699de8d18b6a07d8b355e11cf02
    command: [migrate, --datastore-engine, postgres,
      --datastore-uri, "postgres://bench:bench@openfga-postgres:5432/bench?sslmode=disable"]
    depends_on:
      openfga-postgres: {condition: service_healthy}
    restart: on-failure:5

  openfga:
    <<: *limits
    profiles: [openfga]
    image: openfga/openfga:v1.23.0@sha256:2a1b4ef95f2f27e6d420f11cf14390b4f537e699de8d18b6a07d8b355e11cf02
    command:
      - run
      - --datastore-engine=postgres
      - --datastore-uri=postgres://bench:bench@openfga-postgres:5432/bench?sslmode=disable
      - --datastore-max-open-conns=60
      - --datastore-max-idle-conns=60
      - --authn-method=preshared
      - --authn-preshared-keys=${OPENFGA_KEY:-bench-openfga-key-0123456789}
      - --playground-enabled=false
      - --check-query-cache-enabled
      - --check-iterator-cache-enabled
      - --list-objects-iterator-cache-enabled
      - --cache-controller-enabled
      # ListObjects takes no limit in the request; the benchmark's lookups
      # ask the other products for 100 (authzbench -lookup-limit).
      - --listObjects-max-results=${BENCH_LOOKUP_LIMIT:-100}
      - --log-format=json
      - --log-level=warn
    depends_on:
      openfga-migrate: {condition: service_completed_successfully}
    ports:
      - 127.0.0.1:18081:8080

  # Keycloak, the identity provider of the sign-in benchmark, on its own
  # PostgreSQL, from the optimized image keycloak/Dockerfile builds. Its
  # issuer is the address the benchmark's browser uses (127.0.0.1:18180);
  # services inside this network reach it as keycloak:8080, which the
  # dynamic backchannel allows. 9000 is the management port (health and
  # metrics), not the API.
  keycloak-postgres:
    <<: *postgres
    profiles: [keycloak]
    volumes:
      - keycloak-pg:/var/lib/postgresql/data

  keycloak:
    <<: *limits
    profiles: [keycloak]
    build:
      context: keycloak
    image: authz-bench-keycloak:26.8.2
    command:
      - start
      - --optimized
      - --db-url=jdbc:postgresql://keycloak-postgres:5432/bench
      - --db-username=bench
      - --db-password=bench
      - --db-pool-min-size=20
      - --db-pool-initial-size=20
      - --db-pool-max-size=40
      - --hostname=http://127.0.0.1:18180
      - --hostname-backchannel-dynamic=true
      - --http-enabled=true
      - --proxy-headers=xforwarded
      - --log-level=warn
      - --log-console-output=json
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: bench-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-bench-keycloak-admin-0123456789}
    depends_on:
      keycloak-postgres: {condition: service_healthy}
    ports:
      - 127.0.0.1:18180:8080
      - 127.0.0.1:19000:9000

  # oauth2-proxy in front of an app, signing in through Keycloak: the
  # forward-auth product the gateway is compared with. A reverse proxy
  # asks /oauth2/auth (202 or 401) before passing a request on. The
  # browser goes to Keycloak at its public address and oauth2-proxy
  # redeems codes and reads keys at keycloak:8080, so discovery is
  # skipped and each endpoint is named.
  oauth2-proxy:
    <<: *limits
    profiles: [keycloak]
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.6@sha256:c3415e8660af553f5e18f5d90db050614c02493c0ac6260ac59442f6d9b12048
    command:
      - --http-address=0.0.0.0:4180
      - --provider=keycloak-oidc
      - --client-id=bench-proxy
      - --client-secret=${KEYCLOAK_CLIENT_SECRET:-bench-keycloak-client-0123456789}
      - --oidc-issuer-url=http://127.0.0.1:18180/realms/bench
      - --skip-oidc-discovery=true
      - --login-url=http://127.0.0.1:18180/realms/bench/protocol/openid-connect/auth
      - --redeem-url=http://keycloak:8080/realms/bench/protocol/openid-connect/token
      - --oidc-jwks-url=http://keycloak:8080/realms/bench/protocol/openid-connect/certs
      - --redirect-url=http://127.0.0.1:14180/oauth2/callback
      - --code-challenge-method=S256
      - --email-domain=*
      - --upstream=static://200
      - --reverse-proxy=true
      - --skip-provider-button=true
      - --set-xauthrequest=true
      - --cookie-secret=${OAUTH2_PROXY_COOKIE_SECRET:-YmVuY2gtb2F1dGgyLXByb3h5LWNvb2tpZS1zZWNyZXQ=}
      - --cookie-secure=true
      - --cookie-samesite=lax
      - --session-store-type=redis
      - --redis-connection-url=redis://oauth2-proxy-redis:6379
      - --request-logging=false
      - --auth-logging=false
      - --standard-logging=false
    depends_on:
      oauth2-proxy-redis: {condition: service_healthy}
    ports:
      - 127.0.0.1:14180:4180

  # oauth2-proxy's session store. Its documentation recommends Redis once
  # sessions hold an OIDC provider's tokens: in cookies they pass the 4 KB
  # cookie limit and are split, and every request carries them.
  oauth2-proxy-redis:
    <<: *limits
    profiles: [keycloak]
    image: redis:8.12.0-alpine@sha256:5af80107c1eeecb484a2269b80a26d12bfa6521787da4663bd9f19f60a163483
    command: [redis-server, --save, "", --appendonly, "no", --maxmemory-policy, noeviction]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 60

  # Zitadel, the second identity provider of the sign-in benchmark, on its
  # own PostgreSQL. start-from-init creates its database and user with the
  # admin account below, sets up the first instance and serves. Zitadel
  # finds the instance by the request's host, so it is reached as
  # localhost:18280, its external address, from the host and the
  # benchmark alike. The first instance's machine user is an instance
  # administrator; its personal access token goes to
  # /bootstrap/admin.pat on the zitadel-bootstrap volume, which
  # verify-identity.sh copies out (docker compose cp). Instance policies
  # are set by the DEFAULTINSTANCE variables before the instance exists;
  # README.md says why each one is set.
  zitadel-postgres:
    <<: *postgres
    profiles: [zitadel]
    volumes:
      - zitadel-pg:/var/lib/postgresql/data

  # The image has no shell, so the token's directory is made writable for
  # Zitadel's user by a one-shot container of the PostgreSQL image.
  zitadel-bootstrap:
    profiles: [zitadel]
    image: postgres:17.12-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
    entrypoint: ["sh", "-c", "chown 1000:1000 /bootstrap && chmod 700 /bootstrap"]
    volumes:
      - zitadel-bootstrap:/bootstrap

  zitadel:
    <<: *limits
    profiles: [zitadel]
    image: ghcr.io/zitadel/zitadel:v4.20.6@sha256:169179455987c52d89c6c719bcd2871d6797e8a8df7c44396cd96d34eec56363
    user: "1000:1000"
    command: [start-from-init, --masterkeyFromEnv, --tlsMode, disabled]
    environment:
      ZITADEL_MASTERKEY: ${ZITADEL_MASTERKEY:-bench-zitadel-masterkey-01234567}
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: "18280"
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_DATABASE_POSTGRES_HOST: zitadel-postgres
      ZITADEL_DATABASE_POSTGRES_PORT: "5432"
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_MAXOPENCONNS: "20"
      ZITADEL_DATABASE_POSTGRES_MAXIDLECONNS: "20"
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: bench
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: bench
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_EXISTINGDATABASE: bench
      ZITADEL_FIRSTINSTANCE_ORG_NAME: bench
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: bench-owner
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_OWNER_PASSWORD:-bench-zitadel-owner-0123456789}
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: bench-admin
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: bench admin
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2030-01-01T00:00:00Z"
      ZITADEL_FIRSTINSTANCE_PATPATH: /bootstrap/admin.pat
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "false"
      ZITADEL_SYSTEMDEFAULTS_PASSWORDHASHER_HASHER_ALGORITHM: argon2id
      ZITADEL_SYSTEMDEFAULTS_PASSWORDHASHER_HASHER_TIME: "2"
      ZITADEL_SYSTEMDEFAULTS_PASSWORDHASHER_HASHER_MEMORY: "19456"
      ZITADEL_SYSTEMDEFAULTS_PASSWORDHASHER_HASHER_THREADS: "1"
      ZITADEL_DEFAULTINSTANCE_PASSWORDCOMPLEXITYPOLICY_MINLENGTH: "12"
      ZITADEL_DEFAULTINSTANCE_PASSWORDCOMPLEXITYPOLICY_HASLOWERCASE: "false"
      ZITADEL_DEFAULTINSTANCE_PASSWORDCOMPLEXITYPOLICY_HASUPPERCASE: "false"
      ZITADEL_DEFAULTINSTANCE_PASSWORDCOMPLEXITYPOLICY_HASNUMBER: "false"
      ZITADEL_DEFAULTINSTANCE_PASSWORDCOMPLEXITYPOLICY_HASSYMBOL: "false"
      ZITADEL_DEFAULTINSTANCE_LOGINPOLICY_ALLOWREGISTER: "false"
      ZITADEL_DEFAULTINSTANCE_LOGINPOLICY_ALLOWEXTERNALIDP: "false"
      ZITADEL_DEFAULTINSTANCE_LOGINPOLICY_PASSWORDLESSTYPE: "0"
      ZITADEL_DEFAULTINSTANCE_LOGINPOLICY_IGNOREUNKNOWNUSERNAMES: "true"
      ZITADEL_DEFAULTINSTANCE_LOGINPOLICY_MFAINITSKIPLIFETIME: 0s
      ZITADEL_DEFAULTINSTANCE_LOCKOUTPOLICY_MAXPASSWORDATTEMPTS: "10"
      ZITADEL_LOG_LEVEL: warn
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 2s
      timeout: 5s
      retries: 90
      start_period: 10s
    volumes:
      - zitadel-bootstrap:/bootstrap
    depends_on:
      zitadel-postgres: {condition: service_healthy}
      zitadel-bootstrap: {condition: service_completed_successfully}
    ports:
      - 127.0.0.1:18280:8080

  # The OpenFGA CLI, for verify.sh to turn the dataset's model into the
  # JSON in openfga-model.json: docker compose run --rm openfga-cli ...
  openfga-cli:
    profiles: [tools]
    image: openfga/cli:v0.9.0@sha256:7a7f9fb0a27a788a0fa7907eb5fc751c3134ca0776245578308e011606b61091

volumes:
  authz-data:
  spicedb-pg:
  openfga-pg:
  keycloak-pg:
  zitadel-pg:
  zitadel-bootstrap:
