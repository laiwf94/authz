name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The test body check compares with the pre-merge commit.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Test (race, coverage)
        run: go test -race -coverprofile=coverage.out ./...
      - name: Coverage
        run: go tool cover -func=coverage.out | tail -1
      - name: Fuzz (short)
        run: |
          go test ./internal/authz/schema -run=^$ -fuzz=FuzzParse -fuzztime=30s
          go test ./internal/authz/store -run=^$ -fuzz=FuzzParseRelationship -fuzztime=30s
          go test ./internal/authn/jose -run=^$ -fuzz=FuzzParse$ -fuzztime=20s
          go test ./internal/authn/jose -run=^$ -fuzz=FuzzParseKeySet -fuzztime=20s
          go test ./internal/authn/seal -run=^$ -fuzz=FuzzOpen -fuzztime=20s
          go test ./internal/authn/redirect -run=^$ -fuzz=FuzzValidate -fuzztime=20s
          go test ./internal/authn/saml -run=^$ -fuzz=FuzzParseResponse -fuzztime=30s
          go test ./internal/authn/saml -run=^$ -fuzz=FuzzParseMetadata -fuzztime=20s
          go test ./internal/authn/config -run=^$ -fuzz=FuzzCheck -fuzztime=20s
      # Every test, subtest and fuzz seed the wicket suite ran before the
      # move must still pass: internal/authn/testdata/wicket-suite.txt.
      - name: Suite counts (authn)
        shell: bash
        run: |
          go test -json -count=1 ./internal/authn/... ./cmd/wicket/... ./cmd/fakeidp/... ./examples/whoami/... \
            | go run scripts/suite-counts.go internal/authn/testdata/wicket-suite.txt
      # Every _test.go file of the three pre-merge trees must have moved with
      # only its import block and package clause changed, apart from the
      # lines listed in scripts/testbody-allow.txt, and every package must
      # keep its test functions.
      - name: Test bodies
        run: ./scripts/testbody-diff.sh
      - name: Vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
