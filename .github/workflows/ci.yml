# The one gate for the whole module: grantd (internal/authz), wicket
# (internal/authn, authz gateway, authz fakeidp) and toolgate
# (internal/agents, authz mcp, authz mcpfake). It replaced the per-repo
# wicket.yml and toolgate.yml in week 1 (#74).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The gate runs as parallel jobs of one run, so a run takes about as long
# as its slowest job (the race-detector tests, about five minutes) instead
# of the sum of every step (about eighteen). Every command is the one the
# single job ran, with the same limits; the fuzz targets are spread over
# three jobs by scripts/fuzz-short.sh. A run passes only when every job does.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      # staticcheck v0.8.2 built with go.mod's toolchain. Findings in test
      # files the week 1 moves froze are listed in scripts/staticcheck-allow.txt;
      # anything else fails.
      - name: Staticcheck
        run: ./scripts/staticcheck.sh
      - name: Test (race, coverage)
        run: go test -race -coverprofile=coverage.out ./...
      # The floor is the lowest pre-merge total of the three repositories
      # (wicket, 93.5%; grantd 95.3%, toolgate 96.4%). Each tree is printed so a
      # drop in one of them shows.
      - name: Coverage
        run: |
          go tool cover -func=coverage.out | tail -1
          m=github.com/laiwf94/authz
          go run scripts/coverage-floor.go -min 93.5 -rest authz \
            -group authn=$m/internal/authn,$m/internal/platform/jose,$m/internal/platform/seal,$m/internal/platform/config,$m/cmd/authz/internal/gateway,$m/cmd/authz/internal/fakeidp,$m/examples/whoami \
            -group agents=$m/internal/agents,$m/cmd/authz/internal/mcp,$m/cmd/authz/internal/mcpfake \
            coverage.out

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Every suite again, built with -tags secretscan: each log line and
      # audit record written through internal/platform/logging and
      # internal/platform/audit is scanned in the test process, and so is
      # all test output. A key, token or password fails the test that wrote
      # it unless scripts/secretscan-allow.txt lists it (#78).
      - name: Secret scan
        shell: bash
        run: |
          set -o pipefail
          go vet -tags secretscan ./internal/platform/logging/...
          go test -tags secretscan -count=1 -json ./... | go run scripts/secret-scan.go -allow scripts/secretscan-allow.txt

  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Each fuzz target for its time budget, a third of them per job:
      # scripts/fuzz-short.sh holds the list and the times.
      - name: Fuzz (short)
        run: ./scripts/fuzz-short.sh ${{ matrix.shard }}/3

  suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The test body check compares with the pre-merge commit.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Every test, subtest and fuzz seed the wicket suite ran before the
      # move must still pass: internal/authn/testdata/wicket-suite.txt.
      # cmd/wicket and cmd/fakeidp are now authz gateway and authz fakeidp,
      # jose and seal moved on to internal/platform in week 2 (#76), and
      # metrics became the shared internal/platform/metrics (#77).
      - name: Suite counts (authn)
        shell: bash
        run: |
          go test -json -count=1 ./internal/authn/... ./internal/platform/jose/... ./internal/platform/seal/... ./internal/platform/metrics/... ./cmd/authz/internal/gateway/... ./cmd/authz/internal/fakeidp/... ./examples/whoami/... \
            | go run scripts/suite-counts.go \
                -map github.com/laiwf94/authz/internal/authn/jose=github.com/laiwf94/authz/internal/platform/jose \
                -map github.com/laiwf94/authz/internal/authn/seal=github.com/laiwf94/authz/internal/platform/seal \
                -map github.com/laiwf94/authz/internal/authn/metrics=github.com/laiwf94/authz/internal/platform/metrics \
                -map github.com/laiwf94/authz/cmd/wicket=github.com/laiwf94/authz/cmd/authz/internal/gateway \
                -map github.com/laiwf94/authz/cmd/fakeidp=github.com/laiwf94/authz/cmd/authz/internal/fakeidp \
                internal/authn/testdata/wicket-suite.txt
      # Every test, subtest and fuzz seed the toolgate suite ran before the
      # move must still pass, under the race detector:
      # internal/agents/testdata/toolgate-suite.txt. The audit package became
      # internal/platform/audit in week 2 (#78) and metrics the shared
      # internal/platform/metrics (#77). Then the SIGKILL crash
      # harnesses against authz mcp serve, the audit chain under load,
      # approvals killed between asking, deciding and using (#77), and a
      # rotating log whose retention removes segments as checkpoints are
      # exported (#81), three times over for more kill points (they also
      # run once in the Test step).
      - name: Suite counts (agents)
        shell: bash
        run: |
          go test -race -json -count=1 ./internal/agents/... ./internal/platform/audit/... ./internal/platform/metrics/... ./cmd/authz/internal/mcp/... ./cmd/authz/internal/mcpfake/... \
            | go run scripts/suite-counts.go \
                -map github.com/laiwf94/authz/internal/agents/audit=github.com/laiwf94/authz/internal/platform/audit \
                -map github.com/laiwf94/authz/internal/agents/metrics=github.com/laiwf94/authz/internal/platform/metrics \
                internal/agents/testdata/toolgate-suite.txt
          go test -race -count=3 -run '^TestMCP(Approval|Retention)?SurvivesSIGKILL$' ./cmd/authz
      # Every _test.go file of the three pre-merge trees must have moved with
      # only its import block and package clause changed, apart from the
      # lines listed in scripts/testbody-allow.txt, and every package must
      # keep its test functions.
      - name: Test bodies
        run: ./scripts/testbody-diff.sh

  end-to-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The authorization API's end-to-end transcript and the README demo
      # (examples/demo.sh), recorded from the grantd binary at 41d9bf0, played
      # through a built `authz serve` across a restart on its data directory:
      # every status, header, body and startup log line must match byte for
      # byte. internal/authz/golden; the in-process replay and the restart on
      # grantd's own data directory run in the Test step.
      - name: Golden replay and demo (authz)
        run: |
          go build -o "$RUNNER_TEMP/authz" ./cmd/authz
          go run scripts/serve-golden.go -- "$RUNNER_TEMP/authz" serve
      # The end-to-end golden transcripts recorded from wicket before the
      # move, replayed through `authz gateway` from WICKET_* variables and a
      # wicket config file (OIDC, SAML, nginx, Traefik and Envoy modes, the
      # forbidden page and the admin API), then the nginx demo in Docker
      # through the same binary: internal/authn/golden/e2e.
      - name: Golden replay and demo (authn)
        run: |
          go test -count=1 -v -run '^TestGoldenGateway$' ./cmd/authz/internal/gateway
          ./wicket/examples/demo.sh
      # toolgate's policy cases and its demo, which compares every decision
      # with a recording made by the old binary.
      - name: Policy cases (agents)
        run: go run ./cmd/authz mcp policy test toolgate/examples/policy.json toolgate/examples/policy_cases.json
      - name: Demo (agents)
        run: ./toolgate/examples/demo.sh
      # One signed audit chain end to end (#81): serve, gateway and mcp as
      # three processes rotating one busy log, verify against the newest
      # checkpoint, an auditor holding only the public key proving that an
      # agent's call was denied (examples/audit/auditor.sh) and refusing a
      # false claim about it, and a removed middle segment named.
      - name: Demo (audit)
        run: ./examples/audit/demo.sh

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Both images carry /wicket -> /authz, and a config served through
      # /wicket, the gateway image and authz gateway answers byte for byte
      # the same: docs/proxies.md, "Moving from wicket".
      # The authz image measured against the week 1 baseline and held under
      # the roadmap's 25 MB limit (uncompressed): bench/image-baseline.json.
      # The Images step reuses the image.
      - name: Image size
        run: |
          docker build -t authz:ci .
          go run scripts/image-size.go -baseline bench/image-baseline.json authz:ci
      - name: Images
        env:
          AUTHZ_IMAGE: authz:ci
        run: ./scripts/image-check.sh
      # The toolgate image keeps /toolgate and /mcpfake as links to /authz;
      # this runs the README's two-container example through them, with
      # TOOLGATE_ variables only: toolgate/README.md, "Moving from the
      # toolgate binary".
      - name: Image (agents)
        run: ./toolgate/examples/image.sh

  vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
