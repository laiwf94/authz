# docs/proxies.md's nginx configuration, with TLS, in front of echo.py.
# The gateway and the app run on the Docker host; proxies.sh starts this.
events {}

http {
  upstream gateway { server host.docker.internal:4180; }
  upstream myapp   { server host.docker.internal:8081; }

  server {
    listen 8443 ssl;
    server_name localhost;
    ssl_certificate     /etc/proxy-certs/tls.pem;
    ssl_certificate_key /etc/proxy-certs/tls-key.pem;

    location /_wicket/ {
      proxy_pass http://gateway/;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /_wicket/auth {
      internal;
      proxy_pass http://gateway/auth?app=wiki;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Forwarded-Proto  $scheme;
      proxy_set_header X-Forwarded-Host   $http_host;
      proxy_set_header X-Forwarded-Uri    $request_uri;
      proxy_set_header X-Forwarded-Method $request_method;
    }

    location / {
      auth_request /_wicket/auth;
      auth_request_set $auth_user     $upstream_http_x_auth_user;
      auth_request_set $auth_email    $upstream_http_x_auth_email;
      auth_request_set $auth_groups   $upstream_http_x_auth_groups;
      auth_request_set $auth_provider $upstream_http_x_auth_provider;
      auth_request_set $auth_token    $upstream_http_x_auth_token;
      auth_request_set $auth_redirect $upstream_http_x_auth_redirect;
      error_page 401 = @login;

      proxy_set_header X-Auth-User     $auth_user;
      proxy_set_header X-Auth-Email    $auth_email;
      proxy_set_header X-Auth-Groups   $auth_groups;
      proxy_set_header X-Auth-Provider $auth_provider;
      proxy_set_header X-Auth-Token    $auth_token;
      proxy_pass http://myapp;
    }

    location @login {
      return 302 $auth_redirect;
    }
  }
}
